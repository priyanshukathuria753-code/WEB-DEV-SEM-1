<DOCTYPE HTML>
    <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" width="device-width",
    initial scale="1.0">
    <title>CSS Selector</title>
    <style>
        div>ul{
            color:violet
        }
        div>h1{
            color:indigo
        }
        #divfirst{
            color:blue;
        }
    </style>
</head>    
<body>
    <div id="div-first">
        <ul>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
        
        <div>
        <h1>Hello</h1>
        </div>
    </div>
</body>  
</DOCTYPE>
