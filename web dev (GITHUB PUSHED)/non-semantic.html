<DOCTYPE html>
     
<html lang="en"

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
    initial-scale=1.0">
    <title>Non-Sementic</title>

<head>
<body>

    <div>

        <h1>Hello</h1>
        <p>Hello div</p>

    </div>

    <span>Hello World</span>

    <p>H<sub>2</sub>O</p>
    <p>X<sup>2</sup></p>

    <p>
        Hello Html
Hello              World                                 (&nbsp; is used for space) in p tag
    
    </p>

    <pre>
        Hello Html
Hello                   World
    </pre>

    <marquee behaviour="" direction="">
        Hello Uncle
    </marquee>

<abbr title="world wide web">
    WWWW
</abbr>
</body>
</head>
